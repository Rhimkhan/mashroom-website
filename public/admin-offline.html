<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Offline | AKHIL FOODS Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #FAF6EE;
      color: #211612;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #FDFBF7;
      border: 1px solid #E8DEC8;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(33, 22, 18, 0.08);
    }
    .badge {
      display: inline-block;
      background: #1C130E;
      color: #C89B3C;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 24px;
      font-weight: 800;
      color: #211612;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #3D2C24;
      margin-bottom: 24px;
    }
    button {
      width: 100%;
      min-height: 44px;
      background: #211612;
      color: #FAF6EE;
      border: 1px solid #211612;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1C130E; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">AKHIL FOODS Admin</span>
    <h1>No internet</h1>
    <p>You are currently offline. Reconnect to the internet to load live orders, inventory, and store reports.</p>
    <button type="button" onclick="window.location.reload()">Retry Connection</button>
  </main>
</body>
</html>
